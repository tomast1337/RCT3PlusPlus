# Minimal CI: compile and run the unit tests (synthetic data only, no game files needed).
#
# The project builds with Clang 23 on GCC 16's libstdc++ (for std::optional<T&>). The jobs
# run inside the official gcc:16 Docker image for that library, and .github/install_clang.sh adds Clang from
# apt.llvm.org. The nob build script is bootstrapped from source in each job.
#
# A checkout has no objects, so every run compiles everything. ccache, kept between runs with
# actions/cache (one cache per job, so the sanitizer flags never share entries), turns that into
# compiling only what changed. Pull requests read the caches that runs on main saved.
#
# Windows builds in MSYS2's CLANG64 (Clang with libc++), as the release workflow's Windows job does
# (docs/windows.md). That job builds the viewer too, as Windows has no other check of it.
#
# Follow-ups, deliberately not covered yet: the viewer build on Linux (Vulkan, windowing) and the libFuzzer
# targets.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays, so the sanitizer job runs even in weeks without a push to main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.cache == 'sanitize' && 'build and test (ASan + UBSan)' || 'build and test' }}
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: gcc:16
    strategy:
      fail-fast: false
      matrix:
        cache: [plain, sanitize]
        # The sanitizer build takes 15+ minutes and often hit the timeout, so pull requests skip it; main and the
        # weekly run keep it. Run `./nob test --sanitize` locally for a change that needs it. No `include` here: it
        # would add an excluded entry back.
        exclude:
          - cache: ${{ github.event_name == 'pull_request' && 'sanitize' || 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Clang
        run: .github/install_clang.sh

      # After Clang: a later GITHUB_PATH entry comes first on the path.
      - name: Install ccache
        run: |
          apt-get install -y -qq --no-install-recommends ccache
          # clang++ and clang links to ccache, found first on the path; ccache then runs the next ones, Clang's.
          mkdir -p /opt/ccache
          ln -s /usr/bin/ccache /opt/ccache/clang++
          ln -s /usr/bin/ccache /opt/ccache/clang
          echo "/opt/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=400M" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cache }}-

      - name: Compiler version
        run: clang++ -v --version

      - name: Bootstrap nob
        run: clang++ -std=c++26 -o nob nob.cpp

      # The tools are built and linked by the plain job already; the sanitizer job only needs the tests.
      - name: Build
        run: |
          ccache --zero-stats
          ./nob build ${{ matrix.cache == 'sanitize' && '--sanitize --no-tools' || '' }}
          ccache --show-stats

      - name: Test
        run: ./nob test ${{ matrix.cache == 'sanitize' && '--sanitize --no-tools' || '' }}

  # ccache as on Linux: copies of ccache.exe named clang++.exe and clang.exe come first on the path (a copy, as
  # MSYS2 symlinks are not real ones for Windows programs), and ccache then runs the next ones, Clang's.
  windows:
    name: build and test (Windows)
    needs: format
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # git is for the version nob writes into the build (git describe).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-ccache
            unzip

      # Into the MSYS2 tree: its shell does not take over the runner's PATH, so GITHUB_PATH would not reach it.
      - name: Install slangc
        run: |
          curl -fsSL -o slang.zip https://github.com/shader-slang/slang/releases/download/v2026.18.2/slang-2026.18.2-windows-x86_64.zip
          mkdir -p /opt/slang && unzip -q slang.zip -d /opt/slang
          rm slang.zip

      - name: Install ccache
        run: |
          mkdir -p /opt/ccache
          cp /clang64/bin/ccache.exe /opt/ccache/clang++.exe
          cp /clang64/bin/ccache.exe /opt/ccache/clang.exe

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Compiler version
        run: clang++ -v --version

      - name: Bootstrap nob
        run: clang++ -std=c++26 -o nob nob.cpp

      # The WMA and WMV decoders use Media Foundation, an optional feature on the server Windows the runner has.
      - name: Enable Media Foundation
        shell: pwsh
        run: Install-WindowsFeature Server-Media-Foundation

      - name: Test
        run: |
          export PATH="/opt/ccache:$PATH" CCACHE_DIR="$PWD/.ccache" CCACHE_MAXSIZE=400M
          ccache --zero-stats
          ./nob test

      - name: Build the viewer
        run: |
          export PATH="/opt/ccache:/opt/slang/bin:$PATH" CCACHE_DIR="$PWD/.ccache" CCACHE_MAXSIZE=400M
          ./nob app
          ccache --show-stats

  # Formatting first: it takes a minute, and the build jobs wait for it, so a formatting slip fails fast instead
  # of after a full build. The tool versions are pinned (clang-format from PyPI, Prettier in nob.cpp) so the result
  # does not depend on what the base image ships: formatting differs between releases, so a floating version would
  # make this flaky.
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: gcc:16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3-pip
          pip install --break-system-packages clang-format==23.1.1
          clang-format --version

      - name: Install Clang
        run: .github/install_clang.sh

      # ./nob format runs Prettier over the scripts through npx, at the version nob pins.
      - name: Install Node.js
        run: |
          apt-get install -y -qq --no-install-recommends nodejs npm
          npx --version

      - name: Bootstrap nob
        run: clang++ -std=c++26 -o nob nob.cpp

      - name: Check formatting
        run: ./nob format --check

      # The scripts' types (scripts/types/rct3pp.d.ts) checked as ./nob script compiles them, at a pinned tsc.
      - name: Type-check the scripts
        run: npx --yes -p typescript@5.4.5 tsc -p scripts --noEmit

  # Static analysis. Pull requests check only the sources they change, and the sources that include a header they
  # change; main checks everything.
  tidy:
    name: tidy
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: gcc:16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch, for the list of changed files.
          fetch-depth: 2

      - name: Install Clang
        run: .github/install_clang.sh

      - name: Install clang-tidy
        run: |
          apt-get install -y -qq --no-install-recommends python3-pip
          pip install --break-system-packages clang-tidy==23.1.3
          clang-tidy --version

      - name: Bootstrap nob
        run: clang++ -std=c++26 -o nob nob.cpp

      - name: Pick the files
        id: files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          changed=$(git diff --name-only HEAD^1 HEAD)
          files=()
          full=false
          for f in $changed; do
            case "$f" in
              .clang-tidy|nob.cpp|nob.hpp|tools/*.hpp|fuzz/*.hpp) full=true ;;
              src/*.hpp|src/*.h)
                # shortcut: direct includers only; a header included through another header is caught on main.
                mapfile -t users < <(grep -rlF "#include \"${f#src/}\"" src tools fuzz --include='*.cpp')
                files+=("${users[@]}") ;;
              src/*.cpp|tools/*.cpp|fuzz/*.cpp) if [ -f "$f" ]; then files+=("$f"); fi ;;
            esac
          done
          if $full; then
            echo "list=" >> "$GITHUB_OUTPUT"
          elif [ ${#files[@]} -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(printf '%s\n' "${files[@]}" | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Static analysis
        if: steps.files.outputs.skip != 'true'
        # The image keeps Debian's GCC 14 beside its own GCC 16, and clang-tidy picks the older one's headers
        # unless told which to use.
        run: |
          printf '#!/bin/sh\nexec clang-tidy --extra-arg=--gcc-install-dir=%s "$@"\n' "$(dirname "$(g++ -print-libgcc-file-name)")" > /usr/local/bin/clang-tidy-gcc
          chmod +x /usr/local/bin/clang-tidy-gcc
          CLANGTIDY=clang-tidy-gcc ./nob tidy ${{ steps.files.outputs.list }}
