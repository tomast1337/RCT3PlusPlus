# Packages for players, made by `./nob package` (the same command runs locally):
#
#   rct3pp-VERSION-linux-x86_64.tar.gz       the game (one binary), README, LICENSE, CHANGELOG and the icons
#   rct3pp-VERSION-windows-x86_64.zip        the same for Windows
#   rct3pp-tools-VERSION-PLATFORM.tar.gz/.zip  the command line tools (ovl-dump, sim-run, ...), shipped apart
#
# VERSION is what `git describe` says (src/core/version.hpp). A tag named v* publishes the packages as that
# release. Each push to main replaces the packages of the `nightly` pre-release and moves its tag to the
# commit. Both releases open with .github/release_notes.md.
#
# Windows does not build yet: its job may fail without failing the run, and the release then says Windows is not
# available. No tests run here: ci.yml covers them on every push and pull request. macOS is not built yet.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One run per ref at a time; a newer push to main waits, and replaces any run still waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    # Forks have no use for the nightly.
    if: github.repository == 'tomast1337/RCT3PlusPlus'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: gcc:16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # The tags, for the version

      # GLFW is vendored; its X11 and Wayland back ends need only these headers to build.
      - name: Install the Vulkan and windowing headers and slangc
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev
          curl -fsSL -o slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.18.2/slang-2026.18.2-linux-x86_64.tar.gz
          mkdir -p /opt/slang && tar -xzf slang.tar.gz -C /opt/slang
          echo "/opt/slang/bin" >> "$GITHUB_PATH"
          # The checkout belongs to another user than the container's root; git describe refuses it otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Package
        run: |
          g++ -std=c++26 -o nob nob.cpp
          ./nob package
          ldd build/release/rct3pp
          # One binary: GLFW is built in and opens the windowing libraries at run time.
          if ldd build/release/rct3pp | grep -E 'glfw|X11|Xrandr|Xcursor|Xi|wayland|xkbcommon|decor'; then exit 1; fi
          echo "newest glibc symbol: $(objdump -T build/release/rct3pp | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist/*

  windows:
    if: github.repository == 'tomast1337/RCT3PlusPlus'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vulkan-devel
            unzip
            zip

      - name: Install slangc
        run: |
          curl -fsSL -o slang.zip https://github.com/shader-slang/slang/releases/download/v2026.18.2/slang-2026.18.2-windows-x86_64.zip
          mkdir -p /opt/slang && unzip -q slang.zip -d /opt/slang
          echo "$(cygpath -w /opt/slang/bin)" >> "$GITHUB_PATH"

      - name: Package
        run: |
          g++ -std=c++26 -o nob nob.cpp
          ./nob package
          ldd build/release/rct3pp.exe
          # One .exe: no MSYS2 DLL (GLFW and the compiler's runtime are linked in).
          if ldd build/release/rct3pp.exe | grep -i ucrt64; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*

  # Publishes whatever built, as long as Linux did, so a missing Windows build does not hold the release back.
  publish:
    needs: [linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/release_notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the notes
        run: |
          cp .github/release_notes.md notes.md
          if compgen -G "dist/*windows*" > /dev/null; then
            printf '\n**Windows:** 64-bit; unpack the .zip and run rct3pp.exe.\n' >> notes.md
          else
            printf '\n**Windows:** not available yet. Windows support is on its way; until then this release is for Linux only.\n' >> notes.md
          fi

      - name: Publish the tag's release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "rct3++ $GITHUB_REF_NAME" --notes-file notes.md --generate-notes

      # One pre-release, kept: its tag moves to the commit, the new packages go up, then the old ones (named after
      # an older version) are removed.
      - name: Publish the nightly
        if: github.ref == 'refs/heads/main'
        run: |
          title="Nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA::8})"
          printf '\nBuilt from %s on main. It is replaced on every change to main; for something steadier, take the latest release.\n' "$GITHUB_SHA" >> notes.md
          if gh release view nightly > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit nightly --title "$title" --notes-file notes.md --prerelease
            gh release upload nightly dist/* --clobber
            for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
              [ -e "dist/$asset" ] || gh release delete-asset nightly "$asset" --yes
            done
          else
            gh release create nightly dist/* --target "$GITHUB_SHA" --prerelease --title "$title" --notes-file notes.md
          fi
