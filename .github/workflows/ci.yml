# Minimal CI: compile and run the unit tests (synthetic data only, no game files needed).
#
# The project needs a C++26 capable GCC (15 or newer). ubuntu-latest ships an older default
# compiler, so the jobs run inside the official gcc:15 Docker image instead of installing a
# toolchain on the host. The nob build script is bootstrapped from source in each job.
#
# Follow-ups, deliberately not covered yet: the Vulkan/GLFW viewer build, the libFuzzer
# targets (these need Clang), and a Windows runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: gcc:15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build and test
            test_flags: ""
          - name: build and test (ASan + UBSan)
            test_flags: "--sanitize"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compiler version
        run: g++ --version

      - name: Bootstrap nob
        run: g++ -std=c++26 -o nob nob.cpp

      - name: Build
        run: ./nob build ${{ matrix.test_flags }}

      - name: Test
        run: ./nob test ${{ matrix.test_flags }}
