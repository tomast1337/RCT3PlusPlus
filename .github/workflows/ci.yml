# Minimal CI: compile and run the unit tests (synthetic data only, no game files needed).
#
# The project needs a C++26 capable GCC (16 or newer, for std::optional<T&>). ubuntu-latest ships an older default
# compiler, so the jobs run inside the official gcc:16 Docker image instead of installing a
# toolchain on the host. The nob build script is bootstrapped from source in each job.
#
# A checkout has no objects, so every run compiles everything. ccache, kept between runs with
# actions/cache (one cache per job, so the sanitizer flags never share entries), turns that into
# compiling only what changed. Pull requests read the caches that runs on main saved.
#
# Follow-ups, deliberately not covered yet: the Vulkan/GLFW viewer build, the libFuzzer
# targets (these need Clang), and a Windows runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays, so the sanitizer job runs even in weeks without a push to main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.cache == 'sanitize' && 'build and test (ASan + UBSan)' || 'build and test' }}
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: gcc:16
    strategy:
      fail-fast: false
      matrix:
        cache: [plain, sanitize]
        # The sanitizer build takes 15+ minutes and often hit the timeout, so pull requests skip it; main and the
        # weekly run keep it. Run `./nob test --sanitize` locally for a change that needs it. No `include` here: it
        # would add an excluded entry back.
        exclude:
          - cache: ${{ github.event_name == 'pull_request' && 'sanitize' || 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ccache
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ccache
          # g++ and gcc links to ccache, found first on the path; ccache then runs the image's compilers.
          # (Debian's own /usr/lib/ccache only links the compilers Debian packages, not the image's.)
          mkdir -p /opt/ccache
          ln -s /usr/bin/ccache /opt/ccache/g++
          ln -s /usr/bin/ccache /opt/ccache/gcc
          echo "/opt/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=400M" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cache }}-

      - name: Compiler version
        run: g++ --version

      - name: Bootstrap nob
        run: g++ -std=c++26 -o nob nob.cpp

      # The tools are built and linked by the plain job already; the sanitizer job only needs the tests.
      - name: Build
        run: |
          ccache --zero-stats
          ./nob build ${{ matrix.cache == 'sanitize' && '--sanitize --no-tools' || '' }}
          ccache --show-stats

      - name: Test
        run: ./nob test ${{ matrix.cache == 'sanitize' && '--sanitize --no-tools' || '' }}

  # Formatting first: it takes a minute, and the build jobs wait for it, so a formatting slip fails fast instead
  # of after a full build. The tool versions are pinned (clang-format from PyPI, Prettier in nob.cpp) so the result
  # does not depend on what the base image ships: formatting differs between releases, so a floating version would
  # make this flaky.
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: gcc:16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3-pip
          pip install --break-system-packages clang-format==23.1.1
          clang-format --version

      # ./nob format runs Prettier over the scripts through npx, at the version nob pins.
      - name: Install Node.js
        run: |
          apt-get install -y -qq --no-install-recommends nodejs npm
          npx --version

      - name: Bootstrap nob
        run: g++ -std=c++26 -o nob nob.cpp

      - name: Check formatting
        run: ./nob format --check

  # Static analysis. Pull requests check only the sources they change, and the sources that include a header they
  # change; main checks everything.
  tidy:
    name: tidy
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: gcc:16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch, for the list of changed files.
          fetch-depth: 2

      - name: Install clang-tidy
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3-pip
          pip install --break-system-packages clang-tidy==23.1.3
          clang-tidy --version

      - name: Bootstrap nob
        run: g++ -std=c++26 -o nob nob.cpp

      - name: Pick the files
        id: files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          changed=$(git diff --name-only HEAD^1 HEAD)
          files=()
          full=false
          for f in $changed; do
            case "$f" in
              .clang-tidy|nob.cpp|nob.hpp|tools/*.hpp|fuzz/*.hpp) full=true ;;
              src/*.hpp|src/*.h)
                # shortcut: direct includers only; a header included through another header is caught on main.
                mapfile -t users < <(grep -rlF "#include \"${f#src/}\"" src tools fuzz --include='*.cpp')
                files+=("${users[@]}") ;;
              src/*.cpp|tools/*.cpp|fuzz/*.cpp) if [ -f "$f" ]; then files+=("$f"); fi ;;
            esac
          done
          if $full; then
            echo "list=" >> "$GITHUB_OUTPUT"
          elif [ ${#files[@]} -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(printf '%s\n' "${files[@]}" | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Static analysis
        if: steps.files.outputs.skip != 'true'
        # The image keeps Debian's GCC 14 beside its own GCC 16, and clang-tidy picks the older one's headers
        # unless told which to use.
        run: |
          printf '#!/bin/sh\nexec clang-tidy --extra-arg=--gcc-install-dir=%s "$@"\n' "$(dirname "$(g++ -print-libgcc-file-name)")" > /usr/local/bin/clang-tidy-gcc
          chmod +x /usr/local/bin/clang-tidy-gcc
          CLANGTIDY=clang-tidy-gcc ./nob tidy ${{ steps.files.outputs.list }}
